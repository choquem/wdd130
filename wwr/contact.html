<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rafting Villa Tunary, you can contact us for more information">
    <meta name="author" content="Miguel Angel Choque">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us Rafting Villa Tunary</title>
</head>
<body>
    <header>
        <img src="images/z-splash.png" alt="logo wwr" height="100">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="n-contact">
            <h1>White Water Rafting Company </h1>
            <div class="company-info">
                    <p>123 Main River Street<br>
                    Villa Tunary, Cochabamba<br>
                    +591 999 999 9999<br>
                    info@whitewater.com</p>
            </div>
        </div>
        <div class="contacts">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15185.909327987727!2d-63.28571684999999!3d-17.909877050000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sbo!4v1790913913383!5m2!1ses!2sbo" width="300" height="350" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div> 
            <div class="contact">
                <form action="#">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                        <input type="radio" name="purpose" id="general" value="general" checked>
                        <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-group">
                            <input type="radio" name="purpose" id="reservation" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-group">
                            <input type="radio" name="purpose" id="website" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                        
                        <label for="message">Message</label>
                        <textarea name="message" id="message"></textarea>
                        
                        <div class="checkbox-group">
                            <input type="checkbox" name="newsletter" id="newsletter">
                            <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                        </div>
                        
                        <button type="submit">Get in Touch!</button>

                </form>
                
            </div>       
        </div>
        
        <section class="employed">
            <h2>We are here to Serve You</h2>
            <div class="employed-grid">
                <figure>
                    <img src="images/miguel_angel.jpg" alt="Miguel Choque">
                    <figcaption>employed Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/henry.jpg" alt="Henry Zubieta">
                    <figcaption>employed Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/alejandra.jpg" alt="Alejandra Michel">
                    <figcaption>employed Profile</figcaption>
                </figure>
            
            </div>
        </section>
    
    </main>
        
    <footer>
        <p>&copy; 2026 &#10070;Exiting Expediction&#10070; Miguel Angel Choque Lascano</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com"><img src="images/facebook.svg" alt="facebook icon"></a>
            <a href="https://www.linkedin.com"> <img src="images/instagram.svg" alt="instagram icon"></a>
            <a href="https://www.instagram.com"> <img src="images/linkedin.svg" alt="linkedin icon"></a>
        </nav>
    </footer>
    
</body>
</html>
